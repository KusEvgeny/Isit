<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Учёт офисного оборудования</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Учёт офисного оборудования</h1>

    <!-- Форма: сюда пользователь вводит данные новой задачи -->
    <form id="equipment-form" class="card">
      <h2>Новое оборудование</h2>

      <label for="equipment-title">Название</label>
      <input id="equipment-title" type="text">
      <div class="error" id="error-title"></div>

      <label for="equipment-category">Категория</label>
      <select id="equipment-category">
        <option value="computer">Компьютер</option>
        <option value="monitor" selected>Монитор</option>
        <option value="printer">Принтер</option>
        <option value="peripheral">Периферия</option>
      </select>

      <br><br>
      <button type="submit" class="primary">Добавить в список</button>
    </form>

    <h2>Список оборудования</h2>

    <!-- Элементы управления: список для выбора, поле ввода, кнопка -->
    <div class="toolbar">
      <select id="status-filter">
        <option value="">Все статусы</option>
        <option value="in_use">В работе</option>
        <option value="in_repair">На ремонте</option>
        <option value="archived">В архиве</option>
      </select>
      <input id="search-input" type="text" placeholder="Поиск по названию...">
      <button id="refresh-button">Загрузить с сервера</button>
    </div>

    <!-- Область отображения информации: «Загрузка…», «Ничего не найдено», ошибки -->
    <div id="info" class="message">Нажмите «Загрузить с сервера»</div>

    <!-- Таблицу заполняет JavaScript -->
    <table id="equipment-table" hidden>
      <thead>
        <tr>
          <th>№</th>
          <th>Номер</th>
          <th>Название</th>
          <th>Категория</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="equipment-body"></tbody>
    </table>

    <p>Единиц оборудования на странице: <strong id="counter">0</strong></p>
  </div>

  <!-- Скрипты подключаются в конце страницы, когда вся разметка уже загружена -->
  <script src="js/mock-data.js"></script>   <!-- данные и таблица запросов учебного сервера (редактируете вы) -->
  <script src="js/mock-api.js"></script>    <!-- «движок» учебного сервера (не менять) -->
  <script src="js/app.js"></script>
</body>
</html>
