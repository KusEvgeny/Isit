<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Учёт офисного оборудования</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Экран 1. Вход в систему -->
  <div id="login-screen" class="container" style="max-width: 400px;">
    <form id="login-form" class="card" novalidate>
      <h1>Вход в систему</h1>

      <label for="login-email">Email</label>
      <input id="login-email" type="text" value="anna@example.com" autocomplete="username">
      <div class="error" id="error-email"></div>

      <label for="login-password">Пароль</label>
      <input id="login-password" type="password" value="123456" autocomplete="current-password">
      <div class="error" id="error-password"></div>

      <div class="error" id="error-login"></div>
      <button type="submit" id="login-button" class="primary">Войти</button>

      <p class="hint">
        Тестовые пользователи (пароль у всех <code>123456</code>):<br>
        <code>anna@example.com</code> — руководитель,<br>
        <code>igor@example.com</code> — сотрудник.
      </p>
    </form>
  </div>

  <!-- Экран 2. Список оборудования -->
  <div id="main-screen" hidden>
    <div class="topbar">
      <strong>Учёт офисного оборудования</strong>
      <span>
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-button">Выйти</button>
      </span>
    </div>

    <div class="container">

      <!-- Форма создания оборудования -->
      <form id="task-form" class="card" novalidate>
        <h2>Новое оборудование</h2>

        <label for="task-title">Название</label>
        <input id="task-title" type="text">
        <div class="error" id="error-title"></div>

        <label for="task-inventory">Инвентарный номер</label>
        <input id="task-inventory" type="text">
        <div class="error" id="error-inventory"></div>

        <label for="task-category">Категория</label>
        <select id="task-category">
          <option value="1">Компьютеры</option>
          <option value="2">Мониторы</option>
          <option value="3">Принтеры</option>
        </select>
        <div class="error" id="error-category"></div>

        <div class="error" id="error-form"></div>
        <button type="submit" id="task-button" class="primary">Добавить оборудование</button>
      </form>

      <!-- Фильтры -->
      <h2>Список оборудования</h2>
      <div class="toolbar">
        <button id="refresh-button">Обновить</button>
      </div>

      <!-- Сообщения -->
      <div id="message" class="message" hidden></div>

      <!-- Таблица -->
      <table id="task-table">
        <thead>
          <tr>
            <th>№</th>
            <th>Инв. номер</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Статус</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="task-body"></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
